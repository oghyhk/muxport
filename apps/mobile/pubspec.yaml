name: muxport_mobile
description: Muxport Flutter mobile app for iOS and Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_protocol:
    path: '../../packages/flutter_protocol'
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.9.0
  fixnum: ^1.1.1
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
